# Runs TypeScript type checking and builds on every push across the monorepo workspaces.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # RAG quality regression gate.
  # Runs the golden eval dataset through the full ChatAgent retrieval pipeline and scores
  # faithfulness using GPT-4o-mini as judge.
  # Build fails if aggregate faithfulness < 0.75.
  # See: apps/api/scripts/rag-eval.ts
  rag-eval:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: "Run RAG evaluation suite"
        run: npm run rag-eval --workspace=apps/api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          RAG_EVAL_FAITHFULNESS_THRESHOLD: "0.75"
      - name: "Upload eval results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: apps/api/rag-eval-results-*.json
