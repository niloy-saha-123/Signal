# Supabase pauses free-tier projects after ~7 days without activity. This runs a
# real query against the database every 3 days so a quiet week of development
# doesn't take Signal's auth and data offline.
# Requires the repo secret DATABASE_URL (the Supabase Postgres connection string).
name: Supabase keepalive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set"; exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "select now(), (select count(*) from competitors)"
