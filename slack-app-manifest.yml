# Create the Signal Slack app: api.slack.com/apps → Create New App → From a manifest.
# Replace https://API_PUBLIC_URL with the API's public origin (same value as the
# API_PUBLIC_URL env var), then copy Client ID / Client Secret / Signing Secret
# from Basic Information into SLACK_CLIENT_ID / SLACK_CLIENT_SECRET / SLACK_SIGNING_SECRET.
display_information:
  name: Signal
  description: Competitor forecasts, alerts and answers in your Slack.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Signal
    always_online: true
  slash_commands:
    - command: /signal
      url: https://API_PUBLIC_URL/api/slack/commands
      description: Ask Signal, see a competitor's forecasts, or file intel
      usage_hint: "ask <question> | forecast <competitor> | intel [url] [note]"
      should_escape: false
  shortcuts:
    - name: Send to Signal
      type: message
      callback_id: send_to_signal
      description: File this message as intel on a competitor
oauth_config:
  redirect_urls:
    - https://API_PUBLIC_URL/api/slack/oauth/callback
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - im:history
      - incoming-webhook
settings:
  event_subscriptions:
    request_url: https://API_PUBLIC_URL/api/slack/events
    bot_events:
      - app_mention
      - message.im
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://API_PUBLIC_URL/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
