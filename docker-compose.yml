# Orchestrates the API server, BullMQ worker, PostgreSQL, and Redis as isolated services for local development.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    ports:
      # Host port 5433, not 5432 — avoids colliding with a locally-installed
      # Postgres (Postgres.app, Homebrew, etc). Inside the Docker network,
      # other services still reach this at postgres:5432 — only the host-side
      # mapping changed.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run dev -w @signal/api
    working_dir: /app
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run worker -w @signal/api
    working_dir: /app
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
